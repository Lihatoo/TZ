[package]
name = "tz"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
fs2 = "0.4.3"
jiff = "0.2.35"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
tempfile = "3.27.0"
toml = "0.8"
